<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Colokin - Inventori dan Penjualan Aksesori HP</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("colokin_theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>
:root{--bg:#fdf6f8;--card:#fff;--ink:#2a2025;--mut:#85757c;--line:#f2dde4;--pk:#e0457b;--pkd:#c2336a;--pkl:#ffeaf1;--ok:#168a5c;--okb:#e4f6ee;--bad:#d03b3b;--badb:#fde8e8;--warn:#a86400;--warnb:#fff1d9;--onpk:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1418;--card:#261c21;--ink:#f8eff2;--mut:#b9a5ad;--line:#3b2b32;--pk:#ff7aa5;--pkd:#ff9bbb;--pkl:#3a2230;--okb:#143528;--ok:#4fd69c;--bad:#ff8a8a;--warn:#ffc766;--onpk:#2a0f1a;--badb:#3d2020;--warnb:#3b2d12;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1418;--card:#261c21;--ink:#f8eff2;--mut:#b9a5ad;--line:#3b2b32;--pk:#ff7aa5;--pkd:#ff9bbb;--pkl:#3a2230;--okb:#143528;--ok:#4fd69c;--bad:#ff8a8a;--warn:#ffc766;--onpk:#2a0f1a;--badb:#3d2020;--warnb:#3b2d12;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.3px}h2{margin:0 0 6px;font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.5px}h3{margin:18px 0 10px;font-size:16px}
small,.mut{color:var(--mut);font-size:12px}
.app{display:grid;grid-template-columns:232px 1fr}
#side{position:sticky;top:0;align-self:start;padding:18px 12px;border-right:1px solid var(--line);background:var(--card);min-height:100%}
.brand{font-weight:800;font-size:19px;padding:4px 10px 14px;color:var(--pk)}.brand small{display:block;font-weight:500}
.grp{font-size:12px;color:var(--mut);padding:14px 10px 4px;font-weight:600}
.nv{display:block;padding:9px 12px;border-radius:12px;cursor:pointer;font-weight:600;color:var(--ink)}
.nv:hover{background:var(--pkl)}.nv.on{background:var(--pk);color:var(--onpk)}
#main{padding:22px 26px;max-width:1100px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--pk)}.btn.pk{background:var(--pk);border-color:var(--pk);color:var(--onpk)}.btn.pk:hover{background:var(--pkd)}
.sm{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:3px 10px;font:inherit;font-size:12px;font-weight:600;cursor:pointer}
.sm.bad{color:var(--bad)}
.cnt{background:var(--pk);color:var(--onpk);border-radius:999px;padding:0 8px;margin-left:4px}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:20px;align-items:center;background:linear-gradient(120deg,var(--pkl),var(--card));border:1px solid var(--line);border-radius:24px;padding:26px}
.hero p{color:var(--mut);margin:0 0 16px;max-width:36ch}
.tag{display:inline-block;background:var(--card);color:var(--pk);border:1px solid var(--line);border-radius:999px;padding:2px 12px;font-size:12px;font-weight:700;margin-bottom:10px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:2px;font-size:12px}
.mc span{color:var(--pk);font-weight:700}
.em{display:grid;place-items:center;font-size:30px;height:64px;border-radius:12px;background:var(--pkl);margin-bottom:6px;position:relative}
.em.big{height:110px;font-size:46px}
.product-art{height:150px;border-radius:14px;display:grid;place-items:center;position:relative;overflow:hidden;margin-bottom:7px;background:linear-gradient(145deg,#fff0f5,#f8dce7 62%,#f4e7ef)}
.product-art img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.photo-placeholder{font-size:42px;filter:saturate(.8)}
.mc .product-art{height:64px;margin:0 0 5px}.mc .photo-placeholder{font-size:24px}
.image-field{margin:14px 0;padding:12px;border:1px dashed var(--line);border-radius:14px;background:var(--bg)}
.image-preview{width:100%;height:150px;object-fit:cover;border-radius:10px;margin:8px 0;display:none}
.image-field input[type=range]{padding:0;accent-color:var(--pk)}
.type-select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:7px 9px;font:inherit;font-size:12px;margin:6px 0}
.new{position:absolute;top:8px;left:8px;background:var(--pk);color:var(--onpk);font-style:normal;font-size:11px;font-weight:700;border-radius:999px;padding:0 8px}
.bar input,.md input,.md select,.fr input,.fr select,.card input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 14px;font:inherit}
.bar{margin:18px 0 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips a{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600}
.chips a.on{background:var(--pk);color:var(--onpk);border-color:var(--pk)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:2px;position:relative}
.pc b{font-size:13px}.pr{display:flex;justify-content:space-between;align-items:center;margin-top:6px}.pr b{color:var(--pk);font-size:14px}
.add{width:32px;height:32px;border-radius:50%;border:0;background:var(--pk);color:var(--onpk);font-size:18px;cursor:pointer}.add:disabled{background:var(--line);cursor:not-allowed}
.low{color:var(--bad)!important}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px}
.tw{padding:0;overflow-x:auto}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}th{font-size:12px;color:var(--mut);font-weight:600;background:var(--pkl)}tr:last-child td{border-bottom:0}
.act{text-align:right}
.bd{padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}.bd.ok{background:var(--okb);color:var(--ok)}.bd.no{background:var(--badb);color:var(--bad)}.bd.wr{background:var(--warnb);color:var(--warn)}
.fr{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.fr label,.md label{display:block;font-size:12px;font-weight:600;color:var(--mut)}.md label{margin-bottom:10px}
.fr input,.fr select{margin-top:4px}
.ov{position:fixed;inset:0;background:rgba(30,10,20,.45);display:grid;place-items:center;padding:16px;z-index:20}
.md{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:520px;max-height:90%;overflow:auto}.md h3{margin-top:0}
.md input,.md select{margin-top:4px}
.ft{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.sum{display:flex;justify-content:space-between;padding:3px 0}.sum.t{font-weight:800;font-size:16px;color:var(--pk)}
.seg{display:flex;flex-direction:column;gap:4px;padding:0 4px}.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:7px 10px;font:inherit;font-weight:600;cursor:pointer;text-align:left}.seg button.on{background:var(--pk);border-color:var(--pk);color:var(--onpk)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
:focus-visible{outline:2px solid var(--pk);outline-offset:2px}
@media(max-width:820px){.app{grid-template-columns:1fr}#side{position:static;display:flex;overflow-x:auto;gap:4px;padding:10px;border-right:0;border-bottom:1px solid var(--line);min-height:0}.grp,.brand small{display:none}.seg{flex-direction:row}.seg button{white-space:nowrap}.brand{padding:8px 10px;white-space:nowrap}.nv{white-space:nowrap}#main{padding:16px}.hero{grid-template-columns:1fr}h2{font-size:22px}}
</style></head><body>
<div class="app"><nav id="side"></nav><main id="main"></main></div>
<div id="modal"></div><div id="toast"></div>
<script>
const BRAND='Colokin',KEY='colokin_v1',$=s=>document.querySelector(s);
const rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const JENIS={C:['Casing','📱'],H:['Charger','🔌'],K:['Kabel','🔗'],A:['Audio','🎧'],P:['Powerbank','🔋'],G:['Tempered Glass','🛡️']};
const TRX={M:'Penerimaan',K:'Penjualan',R:'Retur'};
const NAV=[['beranda','🛍️','Kasir dan Toko'],['h','Master'],['barang','📦','Barang'],['vendor','🏭','Vendor'],['satuan','📏','Satuan'],['margin','💹','Margin'],['h','Transaksi'],['pengadaan','🚚','Pengadaan'],['penjualan','🧾','Penjualan'],['retur','↩️','Retur'],['h','Laporan'],['stok','📊','Kartu Stok']];
let S,page='beranda',cat='',q='',cart={},tipePilihan={},AUTH=null,dr=[],dv=0,rt={pn:0,b:0},ks=0;
const now=()=>new Date().toISOString().slice(0,16).replace('T',' ');
const nid=a=>a.reduce((m,x)=>Math.max(m,x.id),0)+1;
const nm=id=>(S.barang.find(x=>x.id==id)||{}).nama||'-';
const sat=id=>(S.satuan.find(x=>x.id==id)||{}).nama||'-';
const vn=id=>(S.vendor.find(x=>x.id==id)||{}).nama||'-';
const ic=b=>(JENIS[b.jenis]||[0,'📦'])[1];
const productArt=b=>{const x=Math.max(0,Math.min(100,Number(b.gambarX??50))),y=Math.max(0,Math.min(100,Number(b.gambarY??50)));return `<div class="product-art">${b.gambar?`<img src="${esc(b.gambar)}" alt="Foto ${esc(b.nama)}" loading="lazy" style="object-position:${x}% ${y}%">`:`<span class="photo-placeholder" aria-hidden="true">${ic(b)}</span>`}</div>`};
const stok=id=>{const k=S.kartu.filter(x=>x.b==id).pop();return k?k.stock:0};
const mg=()=>(S.margin.find(m=>m.status==1)||{persen:0}).persen;
const hjual=b=>Math.round(b.harga*(1+mg()/100));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function toast(t){const e=$('#toast');e.textContent=t;e.className='on';clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2200)}
function modal(h){$('#modal').innerHTML='<div class="ov" onclick="if(event.target==this)closeM()"><div class="md">'+h+'</div></div>'}
const closeM=()=>{$('#modal').innerHTML=''};
const go=p=>{page=p;render();scrollTo(0,0)};

/* ===== koneksi ke backend (MySQL) ===== */
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});
 const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Terjadi kesalahan di server');return d}
async function load(){try{const session=await api('GET','/api/session');AUTH=session.user;if(!AUTH){S=null;render();return}S=await api('GET','/api/data');render()}catch(e){$('#main').innerHTML='<div class="card"><h1>Tidak bisa mengambil data</h1><p class="mut">'+esc(e.message)+'</p><p>Pastikan server dan MySQL menyala, lalu muat ulang halaman.</p></div>'}}
async function run(fn,ok){try{await fn();await load();if(ok)toast(ok)}catch(e){toast(e.message)}}
const sisa=(pn,b)=>{const p=S.penerimaan.find(x=>x.id==pn),i=p&&p.items.find(x=>x.b==b);return i?i.j-S.retur.filter(r=>r.pn==pn&&r.b==b).reduce((a,r)=>a+r.j,0):0};

/* ===== CRUD generik untuk tabel master ===== */
const stt=v=>'<span class="bd '+(v==1?'ok':'no')+'">'+(v==1?'Aktif':'Nonaktif')+'</span>';
const SB=[[1,'Aktif'],[0,'Nonaktif']];
const CFG={
 barang:{t:'Barang',cols:[['nama','Nama'],['jenis','Jenis',v=>(JENIS[v]||[v])[0]],['satuan','Satuan',v=>esc(sat(v))],['harga','Harga beli',rp],['id','Stok',stok],['baru','New arrival',v=>v==1?'Ya':'-'],['status','Status',stt]],
  f:[['nama','Nama barang','text'],['jenis','Jenis','sel',Object.entries(JENIS).map(([k,v])=>[k,v[0]])],['satuan','Satuan','sel',()=>S.satuan.map(s=>[s.id,s.nama])],['harga','Harga beli (Rp)','number'],['baru','Tampilkan sebagai new arrival','sel',[[1,'Ya'],[0,'Tidak']]],['status','Status','sel',SB]],
  used:id=>S.kartu.some(k=>k.b==id)||S.pengadaan.some(p=>p.items.some(i=>i.b==id))},
 vendor:{t:'Vendor',cols:[['nama','Nama vendor'],['hukum','Badan hukum',v=>v=='Y'?'Berbadan hukum':'Non badan hukum'],['status','Status',stt]],
  f:[['nama','Nama vendor','text'],['hukum','Badan hukum','sel',[['Y','Berbadan hukum'],['N','Non badan hukum']]],['status','Status','sel',SB]],used:id=>S.pengadaan.some(p=>p.v==id)},
 satuan:{t:'Satuan',cols:[['nama','Nama satuan'],['status','Status',stt]],f:[['nama','Nama satuan','text'],['status','Status','sel',SB]],used:id=>S.barang.some(b=>b.satuan==id)},
 margin:{t:'Margin Penjualan',cols:[['persen','Margin',v=>v+'%'],['status','Status',stt]],f:[['persen','Persen margin (%)','number'],['status','Status (satu yang aktif dipakai kasir)','sel',SB]],used:id=>S.penjualan.some(p=>p.m==id)}};
function crud(k){const c=CFG[k];
 return `<div class="top"><h1>${c.t}</h1><button type="button" class="btn pk" onclick="openItemForm('${k}')">Tambah ${c.t.toLowerCase()}</button></div><div class="card tw"><table><thead><tr>${c.cols.map(x=>'<th>'+x[1]+'</th>').join('')}<th></th></tr></thead><tbody>${S[k].map(r=>'<tr>'+c.cols.map(x=>'<td>'+(x[2]||esc)(r[x[0]])+'</td>').join('')+`<td class="act"><button type="button" class="sm" onclick="openItemForm('${k}',${r.id})">Ubah</button> <button type="button" class="sm bad" onclick="del('${k}',${r.id})">Hapus</button></td></tr>`).join('')||'<tr><td colspan="9" class="mut">Belum ada data. Tambahkan yang pertama.</td></tr>'}</tbody></table></div>`}
function openItemForm(k,id){try{const c=CFG[k],r=id?S[k].find(x=>x.id==id):{status:1,hukum:'Y',jenis:'C',satuan:(S.satuan[0]||{}).id,baru:0};
 if(!c||id&&!r)throw new Error('Data barang tidak ditemukan');
 modal(`<h3>${id?'Ubah':'Tambah'} ${c.t.toLowerCase()}</h3>`+c.f.map(f=>{const o=typeof f[3]=='function'?f[3]():f[3];
  return `<label>${f[1]}`+(f[2]=='sel'?`<select id="f_${f[0]}">${o.map(x=>`<option value="${x[0]}"${x[0]==r[f[0]]?' selected':''}>${esc(x[1])}</option>`).join('')}</select>`:`<input id="f_${f[0]}" type="${f[2]}" value="${esc(r[f[0]]==null?'':r[f[0]])}"${f[2]=='number'?' min="0" step="any"':''}>`)+'</label>'}).join('')
  +(k=='barang'?`<div class="image-field"><label>Foto produk (JPG, PNG, WebP · maks. 5 MB)<input id="f_gambar" type="file" accept="image/jpeg,image/png,image/webp" onchange="previewImage(this)"></label><img id="imagePreview" class="image-preview" src="${esc(r.gambar||'')}" style="display:${r.gambar?'block':'none'};object-position:${Number(r.gambarX??50)}% ${Number(r.gambarY??50)}%"><label>Posisi horizontal <span id="posXLabel">${Number(r.gambarX??50)}%</span><input id="f_gambarX" type="range" min="0" max="100" value="${Number(r.gambarX??50)}" oninput="previewPosition()"></label><label>Posisi vertikal <span id="posYLabel">${Number(r.gambarY??50)}%</span><input id="f_gambarY" type="range" min="0" max="100" value="${Number(r.gambarY??50)}" oninput="previewPosition()"></label><small>Geser untuk mengatur bagian foto yang terlihat di katalog.</small></div>`:'')
  +`<div class="ft"><button type="button" class="btn" onclick="closeM()">Batal</button><button type="button" class="btn pk" onclick="simpan('${k}',${id||0})">Simpan</button></div>`)}catch(e){toast('Form tidak bisa dibuka: '+e.message)}}
function previewImage(input){const f=input.files[0],p=$('#imagePreview');if(!f||!p)return;p.src=URL.createObjectURL(f);p.style.display='block';previewPosition()}
function previewPosition(){const p=$('#imagePreview'),x=$('#f_gambarX'),y=$('#f_gambarY');if(!p||!x||!y)return;p.style.objectPosition=x.value+'% '+y.value+'%';$('#posXLabel').textContent=x.value+'%';$('#posYLabel').textContent=y.value+'%'}
function fileData(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(new Error('Gagal membaca gambar'));reader.readAsDataURL(file)})}
function simpan(k,id){const c=CFG[k],d={};
 for(const f of c.f){let v=$('#f_'+f[0]).value.trim();
  if(f[2]=='text'&&!v)return toast(f[1]+' wajib diisi');
  if(f[2]=='number'){v=Number(v);if(isNaN(v)||v<=0)return toast(f[1]+' harus angka lebih dari 0')}
  else if(f[2]=='sel'&&v!==''&&!isNaN(v))v=Number(v);d[f[0]]=v}
 const file=k=='barang'&&$('#f_gambar')?$('#f_gambar').files[0]:null;
 if(file&&file.size>5*1024*1024)return toast('Ukuran gambar maksimal 5 MB');
 const x=k=='barang'?Number($('#f_gambarX').value):null,y=k=='barang'?Number($('#f_gambarY').value):null;
 closeM();run(async()=>{const result=await api(id?'PUT':'POST','/api/master/'+k+(id?'/'+id:''),d);if(k=='barang'){const productId=id||result.id;if(file){const gambar=await fileData(file);await api('PUT','/api/barang/'+productId+'/gambar',{gambar})}await api('PUT','/api/barang/'+productId+'/posisi-gambar',{x,y})}},'Data tersimpan')}
function del(k,id){if(CFG[k].used(id))return toast('Data ini sudah dipakai transaksi. Ubah statusnya jadi Nonaktif.');
 modal(`<h3>Hapus data?</h3><p>Data yang dihapus tidak bisa dikembalikan.</p><div class="ft"><button class="btn" onclick="closeM()">Batal</button><button class="btn pk" onclick="del2('${k}',${id})">Hapus</button></div>`)}
function del2(k,id){closeM();run(()=>api('DELETE','/api/master/'+k+'/'+id),'Data dihapus')}

/* ===== kasir dan toko ===== */
function grid(){const g=$('#grid');if(!g)return;
 const l=S.barang.filter(b=>b.status==1&&(!cat||b.jenis==cat)&&b.nama.toLowerCase().includes(q.toLowerCase()));
 g.innerHTML=l.length?l.map(b=>{const s=stok(b.id);return `<div class="pc">${productArt(b)}${b.baru==1?'<i class="new">Baru</i>':''}<b>${esc(b.nama)}</b><small>${(JENIS[b.jenis]||[b.jenis])[0]}, per ${esc(sat(b.satuan))}</small><label><small>Tipe HP</small><select class="type-select" onchange="tipePilihan[${b.id}]=this.value">${TIPE_HP.map(t=>`<option${t==(tipePilihan[b.id]||'Universal')?' selected':''}>${t}</option>`).join('')}</select></label><small class="${s<=5?'low':''}">${s?'Stok '+s:'Stok habis'}</small><div class="pr"><b>${rp(hjual(b))}</b><button class="add" aria-label="Tambah ke keranjang" ${s?'':'disabled'} onclick="add(${b.id})">+</button></div></div>`}).join(''):'<p class="mut">Produk tidak ditemukan. Coba kata kunci atau kategori lain.</p>'}
const cartN=()=>Object.values(cart).reduce((a,b)=>a+b.j,0);
const TIPE_HP=['Universal','iPhone','Samsung','Xiaomi','Oppo','Vivo','Realme','Infinix'];
function add(id){const item=cart[id]||{j:0,th:tipePilihan[id]||'Universal'};if(item.j+1>stok(id))return toast('Stok tidak cukup');item.j++;cart[id]=item;$('.cnt').textContent=cartN();toast('Masuk keranjang')}
function qty(id,d){const item=cart[id],n=item.j+d;if(n>stok(id))return toast('Stok tidak cukup');if(n<=0)delete cart[id];else item.j=n;$('.cnt').textContent=cartN();openCart()}
function setTipe(id,value){if(cart[id])cart[id].th=value;openCart()}
function openCart(){const ids=Object.keys(cart);let sub=0;
 const rows=ids.map(id=>{const b=S.barang.find(x=>x.id==id),h=hjual(b),j=cart[id].j;sub+=h*j;return `<tr><td>${esc(b.nama)}<select class="type-select" onchange="setTipe(${id},this.value)">${TIPE_HP.map(t=>`<option${t==cart[id].th?' selected':''}>${t}</option>`).join('')}</select></td><td>${rp(h)}</td><td><button class="sm" onclick="qty(${id},-1)">-</button> ${j} <button class="sm" onclick="qty(${id},1)">+</button></td><td>${rp(h*j)}</td></tr>`}).join(''),ppn=Math.round(sub*.11);
 modal('<h3>Keranjang</h3>'+(ids.length?`<div class="tw"><table><thead><tr><th>Barang / Tipe HP</th><th>Harga</th><th>Jumlah</th><th>Subtotal</th></tr></thead><tbody>${rows}</tbody></table></div><div style="margin-top:12px"><div class="sum"><span>Subtotal</span><span>${rp(sub)}</span></div><div class="sum"><span>PPN 11%</span><span>${rp(ppn)}</span></div><div class="sum t"><span>Total</span><span>${rp(sub+ppn)}</span></div></div><div class="ft"><button class="btn" onclick="closeM()">Lanjut belanja</button><button class="btn pk" onclick="checkout()">Bayar sekarang</button></div>`:'<p class="mut">Keranjang masih kosong. Pilih produk lalu tekan tombol +.</p><div class="ft"><button class="btn" onclick="closeM()">Tutup</button></div>'))}
async function checkout(){const items=Object.keys(cart).map(id=>({b:+id,j:cart[id].j,th:cart[id].th}));try{await api('POST','/api/jual',{items});cart={};closeM();await load();toast('Penjualan tersimpan di database, stok berkurang')}catch(e){toast(e.message)}}

/* ===== halaman ===== */
async function loginDo(){try{const d=await api('POST','/api/login',{username:$('#login-user').value.trim(),password:$('#login-pass').value});AUTH=d.user;page='beranda';await load();toast('Login berhasil')}catch(e){toast(e.message)}}
async function logoutDo(){await api('POST','/api/logout');AUTH=null;S=null;cart={};page='akun';render()}
const PAGES={
 akun:()=>AUTH?`<div class="card"><h1>Akun</h1><p>Login sebagai <b>${esc(AUTH.username)}</b> · ${AUTH.role=='superadmin'?'Super Admin':AUTH.role=='admin'?'Admin':'Kasir'}</p><button class="btn pk" onclick="logoutDo()">Keluar</button></div>`:`<div class="card" style="max-width:440px;margin:7vh auto"><span class="tag">COLOKIN · AKSES TOKO</span><h1>Login</h1><p class="mut">Masuk menggunakan akun Super Admin, admin, atau kasir.</p><form onsubmit="event.preventDefault();loginDo()"><label>Username<input id="login-user" autocomplete="username" required></label><label style="display:block;margin-top:12px">Password<input id="login-pass" type="password" autocomplete="current-password" required></label><button class="btn pk" style="width:100%;margin-top:16px">Masuk</button></form><small>Akun awal: superadmin / superadmin123 · admin / admin123 · kasir1 / kasir123</small></div>`,
 beranda:()=>{const baru=S.barang.filter(b=>b.status==1&&b.baru==1).slice(0,3);
  return `<div class="top"><div><small>Halo, Kasir</small><h1>Temukan aksesori terbaik</h1></div><button class="btn" onclick="openCart()">Keranjang <b class="cnt">${cartN()}</b></button></div>
  <section class="hero"><div><span class="tag">Koleksi baru</span><h2>Lengkapi gadget, gaya makin maksimal</h2><p>Casing, charger, dan earphone terbaru dari supplier langsung ke etalase.</p><button class="btn pk" onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})">Belanja sekarang</button></div>
  <div class="mini">${baru.map(b=>`<div class="mc">${productArt(b)}<b>${esc(b.nama)}</b><span>${rp(hjual(b))}</span></div>`).join('')||'<p class="mut">Tandai barang sebagai new arrival lewat menu Barang.</p>'}</div></section>
  <div class="bar"><input id="q" type="search" placeholder="Cari produk, misalnya charger" value="${esc(q)}" oninput="q=this.value;grid()"></div>
  <div class="chips"><a class="${cat?'':'on'}" onclick="cat='';render()">Semua</a>${Object.entries(JENIS).map(([k,v])=>`<a class="${cat==k?'on':''}" onclick="cat='${k}';render()">${v[1]} ${v[0]}</a>`).join('')}</div>
  <h3>Produk</h3><div id="grid" class="grid"></div>`},
 barang:()=>crud('barang'),vendor:()=>crud('vendor'),satuan:()=>crud('satuan'),margin:()=>crud('margin'),
 pengadaan:()=>{const vs=S.vendor.filter(v=>v.status==1),bs=S.barang.filter(b=>b.status==1);if(!dv&&vs.length)dv=vs[0].id;
  const sub=dr.reduce((a,i)=>a+i.j*i.h,0);
  return `<div class="top"><h1>Pengadaan</h1></div><div class="card"><div class="fr"><label>Vendor<select onchange="dv=+this.value">${vs.map(v=>`<option value="${v.id}"${v.id==dv?' selected':''}>${esc(v.nama)}</option>`).join('')}</select></label>
  <label>Barang<select id="pb" onchange="$('#ph').value=S.barang.find(x=>x.id==this.value).harga">${bs.map(b=>`<option value="${b.id}">${esc(b.nama)}</option>`).join('')}</select></label>
  <label>Jumlah<input id="pj" type="number" min="1" value="10"></label><label>Harga satuan<input id="ph" type="number" min="1" value="${bs[0]?bs[0].harga:0}"></label><button class="btn" onclick="addDr()">Tambah item</button></div>
  ${dr.length?`<div class="tw" style="margin-top:12px"><table><thead><tr><th>Barang</th><th>Jumlah</th><th>Harga</th><th>Subtotal</th><th></th></tr></thead><tbody>${dr.map((i,n)=>`<tr><td>${esc(nm(i.b))}</td><td>${i.j}</td><td>${rp(i.h)}</td><td>${rp(i.j*i.h)}</td><td class="act"><button class="sm bad" onclick="dr.splice(${n},1);render()">Buang</button></td></tr>`).join('')}</tbody></table></div><div class="top" style="margin:12px 0 0"><span>Subtotal ${rp(sub)} + PPN 11% = <b>${rp(sub+Math.round(sub*.11))}</b></span><button class="btn pk" onclick="saveDr()">Simpan pengadaan</button></div>`:'<p class="mut" style="margin-bottom:0">Tambahkan barang yang mau dipesan ke vendor.</p>'}</div>
  <div class="card tw"><table><thead><tr><th>No</th><th>Tanggal</th><th>Vendor</th><th>Barang</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>${S.pengadaan.slice().reverse().map(p=>`<tr><td>#${p.id}</td><td>${p.tgl}</td><td>${esc(vn(p.v))}</td><td>${p.items.map(i=>i.j+'x '+esc(nm(i.b))).join(', ')}</td><td>${rp(p.total)}</td><td><span class="bd ${p.status=='S'?'ok':'wr'}">${p.status=='S'?'Sudah diterima':'Menunggu barang'}</span></td><td class="act">${p.status=='P'?`<button class="sm" onclick="terima(${p.id})">Terima barang</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">Belum ada pengadaan.</td></tr>'}</tbody></table></div>`},
 penjualan:()=>`<div class="top"><h1>Penjualan</h1><button class="btn pk" onclick="go('beranda')">Buka kasir</button></div><div class="card tw"><table><thead><tr><th>No</th><th>Tanggal</th><th>Barang</th><th>Subtotal</th><th>PPN</th><th>Total</th></tr></thead><tbody>${S.penjualan.slice().reverse().map(p=>`<tr><td>#${p.id}</td><td>${p.tgl}</td><td>${p.items.map(i=>i.j+'x '+esc(nm(i.b))+' · '+esc(i.th||'Universal')).join(', ')}</td><td>${rp(p.sub)}</td><td>${rp(p.ppn)}</td><td><b>${rp(p.total)}</b></td></tr>`).join('')||'<tr><td colspan="6" class="mut">Belum ada penjualan. Buat dari halaman kasir.</td></tr>'}</tbody></table></div>`,
 retur:()=>{const P=S.penerimaan;if(!rt.pn&&P.length)rt.pn=P[0].id;const pr=P.find(x=>x.id==rt.pn),its=pr?pr.items:[];if(!its.some(i=>i.b==rt.b))rt.b=its.length?its[0].b:0;
  return `<div class="top"><h1>Retur ke Vendor</h1></div><div class="card"><div class="fr"><label>Penerimaan<select onchange="rt.pn=+this.value;rt.b=0;render()">${P.map(p=>`<option value="${p.id}"${p.id==rt.pn?' selected':''}>#${p.id} dari ${esc(vn((S.pengadaan.find(x=>x.id==p.pg)||{}).v))}</option>`).join('')}</select></label>
  <label>Barang<select onchange="rt.b=+this.value;render()">${its.map(i=>`<option value="${i.b}"${i.b==rt.b?' selected':''}>${esc(nm(i.b))} (sisa ${sisa(rt.pn,i.b)})</option>`).join('')}</select></label>
  <label>Jumlah<input id="rj" type="number" min="1" value="1"></label><label>Alasan<input id="ra" placeholder="Contoh: charger tidak mengisi"></label><button class="btn pk" onclick="doRetur()">Simpan retur</button></div></div>
  <div class="card tw"><table><thead><tr><th>No</th><th>Tanggal</th><th>Penerimaan</th><th>Barang</th><th>Jumlah</th><th>Alasan</th></tr></thead><tbody>${S.retur.slice().reverse().map(r=>`<tr><td>#${r.id}</td><td>${r.tgl}</td><td>#${r.pn}</td><td>${esc(nm(r.b))}</td><td>${r.j}</td><td>${esc(r.alasan)}</td></tr>`).join('')||'<tr><td colspan="6" class="mut">Belum ada retur.</td></tr>'}</tbody></table></div>`},
 stok:()=>`<div class="top"><h1>Kartu Stok</h1></div><div class="card tw"><table><thead><tr><th>Barang</th><th>Stok saat ini</th><th>Kondisi</th></tr></thead><tbody>${S.barang.map(b=>{const s=stok(b.id);return `<tr><td>${esc(b.nama)}</td><td>${s}</td><td><span class="bd ${s==0?'no':s<=5?'wr':'ok'}">${s==0?'Habis':s<=5?'Menipis':'Aman'}</span></td></tr>`}).join('')}</tbody></table></div>
  <div class="top"><h3 style="margin:0">Riwayat pergerakan</h3><select class="sm" style="padding:6px 10px" onchange="ks=+this.value;render()"><option value="0">Semua barang</option>${S.barang.map(b=>`<option value="${b.id}"${b.id==ks?' selected':''}>${esc(b.nama)}</option>`).join('')}</select></div>
  <div class="card tw"><table><thead><tr><th>Waktu</th><th>Barang</th><th>Transaksi</th><th>Masuk</th><th>Keluar</th><th>Stok</th></tr></thead><tbody>${S.kartu.filter(k=>!ks||k.b==ks).slice().reverse().map(k=>`<tr><td>${k.tgl}</td><td>${esc(nm(k.b))}</td><td>${TRX[k.t]} #${k.trx}</td><td>${k.m||'-'}</td><td>${k.k||'-'}</td><td><b>${k.stock}</b></td></tr>`).join('')||'<tr><td colspan="6" class="mut">Belum ada pergerakan stok.</td></tr>'}</tbody></table></div>`};
function addDr(){const b=+$('#pb').value,j=+$('#pj').value,h=+$('#ph').value;if(!b)return toast('Pilih barang dulu');if(!(j>0&&h>0))return toast('Jumlah dan harga harus lebih dari 0');dr.push({b,j,h});render()}
function saveDr(){if(!dv)return toast('Pilih vendor');run(async()=>{await api('POST','/api/pengadaan',{v:dv,items:dr});dr=[]},'Pengadaan tersimpan')}
function terima(id){run(()=>api('POST','/api/terima/'+id),'Barang diterima, stok bertambah')}
function doRetur(){run(()=>api('POST','/api/retur',{pn:rt.pn,b:rt.b,j:+$('#rj').value,alasan:$('#ra').value.trim()}),'Retur tersimpan, stok berkurang')}
const TK='colokin_theme';
function themeGet(){try{return localStorage.getItem(TK)||'auto'}catch(e){return 'auto'}}
function themeSet(t){try{localStorage.setItem(TK,t)}catch(e){}const r=document.documentElement;if(t=='light'||t=='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');render()}
const themeUI=()=>{const t=themeGet();return '<div class="grp">Tampilan</div><div class="seg">'+[['light','☀️ Terang'],['dark','🌙 Gelap'],['auto','💻 Ikuti sistem']].map(([k,l])=>`<button class="${t==k?'on':''}" onclick="themeSet('${k}')">${l}</button>`).join('')+'</div>'};
function render(){
 if(!AUTH){page='akun';$('#side').innerHTML=`<div class="brand">📱 ${BRAND}<small>Inventori dan penjualan</small></div><a class="nv on" onclick="go('akun')">🔐 Login</a>`;$('#main').innerHTML=PAGES.akun();return}
 const fullAccess=['admin','superadmin'].includes(AUTH.role);
 if(!fullAccess&&!['beranda','penjualan','akun'].includes(page))page='beranda';
 const links=NAV.filter(n=>n[0]!='h'&&(fullAccess||['beranda','penjualan'].includes(n[0]))).map(n=>`<a class="nv${page==n[0]?' on':''}" onclick="go('${n[0]}')">${n[1]} ${n[2]}</a>`).join('');
 $('#side').innerHTML=`<div class="brand">📱 ${BRAND}<small>Inventori dan penjualan</small></div>`+links+`<div class="grp">${esc(AUTH.username)}</div><a class="nv${page=='akun'?' on':''}" onclick="go('akun')">👤 Akun</a>`+themeUI();
 $('#main').innerHTML=PAGES[page]();grid()}
load();
</script></body></html>
